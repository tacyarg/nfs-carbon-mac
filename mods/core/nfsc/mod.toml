# Carbon's widescreen view. What ThirteenAG's NFSCarbon.WidescreenFix (MIT; see
# NOTICE) did with binary patches, done here with hooks and translate-time
# operand redirects (game.toml), because patched code bytes mean nothing to a
# recompiled game.
id = "core.nfsc"
name = "Carbon"
version = "0.1.0"
api = 1
game = "baaaaec33873d4ba7e4dbae6a5212049ffdcf9679a35d865d7625b4189952fd3"
requires = ["core.hooks >= 1.0.0"]
affects_simulation = false

[plugin]
path = "nfsc.dylib"

[settings]
widescreen = { type = "bool", default = true, apply = "restart", label = "Widescreen", group = "graphics", help = "Fills a wide screen instead of a 4:3 picture. Leave on. Takes effect after a restart." }
fov_scaling = { type = "int", default = 1, min = 0, max = 2, choices = "Original|Wider|Widest", apply = "restart", label = "How much you see to the sides", group = "graphics", help = "Original: the PC game's view. Wider: a little more to the sides (default). Widest: more again. Restart to apply." }
console_layout = { type = "bool", default = true, apply = "live", label = "Console controller layout", group = "controls", help = "Gives a controller the console layout (RT gas, LT brake, A handbrake, B nitrous, X speedbreaker, Y crew, LB look back, RB camera, right stick to shift) instead of the PC game's generic one. Your own changes in Options > Controls are kept." }
controller_buttons = { type = "int", default = 0, min = 0, max = 3, choices = "Automatic|Xbox|PlayStation (DualSense)|Nintendo Switch Pro", apply = "live", label = "Button names", group = "controls", help = "Which controller's button names Options > Controls shows. Automatic asks macOS which controller is connected." }
console_prompts = { type = "bool", default = true, apply = "restart", label = "Controller prompts in menus", group = "controls", help = "Menus show your controller's buttons while you use it, and the keyboard's when you type or click. Needs the button icons from the Setup app. Restart to apply." }
skip_intro = { type = "bool", default = false, apply = "restart", label = "Skip intro movies", group = "career", help = "Starts the game without the EA logo and the street-racing warning movies. Story movies still play. Takes effect after a restart." }
hide_online = { type = "bool", default = true, apply = "restart", label = "Hide online modes", group = "career", help = "Removes Quick Match and Custom Match from the main menu: EA's servers for them are closed. Takes effect after a restart." }
render_scale = { type = "int", default = 1, min = 0, max = 2, choices = "Sharpest|Balanced|Fastest", apply = "restart", label = "Render resolution", group = "graphics", help = "How many pixels the 3D world is drawn with. Sharpest: your screen's full resolution (heaviest). Balanced: 1.5x the game resolution. Fastest: exactly the game resolution set in Options > Video. Restart to apply." }
impact_rumble = { type = "int", default = 100, min = 0, max = 200, apply = "live", label = "Rumble: crashes %", group = "controls", help = "How hard the controller shakes when you hit something. 0 turns it off." }
surface_rumble = { type = "int", default = 100, min = 0, max = 200, apply = "live", label = "Rumble: driving %", group = "controls", help = "Shaking from the road surface under the tyres. 0 turns it off." }
rumble_floor = { type = "int", default = 1, min = 0, max = 10, apply = "live", label = "Rumble: ignore tiny shakes %", group = "controls", help = "Very weak rumble below this is skipped, so the controller does not buzz constantly. 0 plays everything." }
input_trace = { type = "bool", default = false, apply = "live", label = "Log rumble (testing)", group = "diagnostics", help = "Writes each rumble change to the log, for troubleshooting." }
