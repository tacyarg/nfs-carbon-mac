<!doctype html>
<!-- The player page for one game's web build. tools/web_launcher.py places it,
     with @APP@.js/.wasm/.data, in <launcher>/<game id>/; the game's files were
     imported by the launcher into the browser's private storage at
     <game id>/game, and the profile lives at <game id>/profile. The page must
     be served cross-origin isolated (COOP same-origin, COEP require-corp).

     The landing phase (#landing) is styled after NFS Carbon's own main menu
     (dark garage-at-night backdrop, the teal double-chevron/tab-bar header,
     the teal dialog band, the dark-olive Accept pill, the slate key-row
     chips), sampled from the game's menu screenshots. The flow (status,
     Play/Enter, ?play=1 autostart, quit-to-landing, the /lan bridge, the
     Online card, Controls) still follows nfsu2.xyz's player page, credited
     at the net code below; no nfsu2 CSS remains. Fonts fall back to the
     platform's own stencil/condensed faces (see .top h1 / --font-ui) rather
     than bundling webfonts, since the build only copies index.html plus the
     app's .js/.wasm/.data to the launcher output -- bundling fonts would
     need CMake and web_launcher.py changes for a purely cosmetic face. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
  :root {
    --font-stencil: "Stencil Std", Stencil, "Arial Black", sans-serif;
    --font-ui: "Helvetica Neue", Arial, sans-serif;
    --night: #0b0d14;
    --night-glow: #2a3242;
    --panel: rgba(8, 16, 18, 0.72);
    --panel-edge: rgba(70, 150, 140, 0.55);
    --field: #0c1414;
    --teal: #1c5248;
    --teal-dark: #0a211c;
    --teal-bright: #d8ece8;
    --yellow: #f0c800;
    --olive: #3c3800;
    --olive-edge: #6b6400;
    --text: #e9ecec;
    --muted: #a9b4b3;
    --bad: #ff8f80;
    --bad-edge: #a23b30;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(900px 360px at 20% -80px, rgba(140, 150, 170, 0.18), transparent 70%),
      linear-gradient(180deg, #1b1f2c 0%, #12151f 45%, var(--night) 100%);
    color: var(--text);
    font: 400 14px/20px var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, p, dl, dd { margin: 0; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #landing { position: fixed; inset: 0; overflow-y: auto; background: inherit; }
  #landing[hidden] { display: none; }

  .app { max-width: 960px; margin: 0 auto; padding: 24px 20px 48px; display: grid; gap: 16px; }
  @media (min-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
    .top, .side { grid-column: 1 / -1; }
    .side { grid-column: auto; }
    .main { display: grid; gap: 16px; }
  }

  /* header: teal chevron emblem + stencil title + a tab-bar strip doubling as the load bar */
  .top { padding: 4px 0 0; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .chevron { flex: none; width: 46px; height: 46px; filter: drop-shadow(0 0 6px rgba(80, 200, 185, 0.5)); }
  .top h1 {
    font: 700 26px/1.1 var(--font-stencil); letter-spacing: 1px; text-transform: uppercase;
    font-stretch: condensed; color: #d7dadb; text-shadow: 0 0 1px #000, 0 1px 0 #000, 0 2px 3px rgba(0,0,0,0.8);
  }
  .top h1::before, .top h1::after { content: "\2605"; color: var(--yellow); font-size: 0.6em; vertical-align: middle; margin: 0 6px; }
  .fan { margin: 6px 0 12px; font-size: 12px; color: var(--muted); }

  .bar {
    position: relative; height: 22px; border-radius: 3px; overflow: hidden;
    background: rgba(4, 10, 10, 0.8);
    border-top: 2px dashed #2f6b5f; border-bottom: 2px dashed #2f6b5f;
    background-image: repeating-linear-gradient(90deg, var(--yellow) 0 2px, transparent 2px 10px);
    background-position: 0 1px, 0 bottom;
    background-size: 100% 2px;
    background-repeat: repeat-x;
  }
  .bar[hidden] { display: none; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal-dark), var(--teal) 60%, #2e8a79); transition: width 0.2s linear; }

  /* panels: dark translucent, thin teal edge, condensed caps headings */
  .panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px; padding: 18px 22px; backdrop-filter: blur(2px); }
  .panel h2 {
    font: 700 14px/20px var(--font-ui); font-stretch: condensed; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--panel-edge);
  }
  .panel.side h2 { color: var(--yellow); }

  /* hero: the dialog band, full width, holding status + Play */
  .hero {
    text-align: center; border: none; padding: 26px 22px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 14px),
      linear-gradient(180deg, var(--teal-dark), var(--teal) 45%, var(--teal-dark));
    border-top: 2px solid var(--teal-bright);
    border-bottom: 2px solid var(--teal-bright);
    box-shadow: 0 0 18px rgba(30, 110, 95, 0.35);
  }
  .status {
    font: 700 22px/28px var(--font-ui); font-stretch: condensed; letter-spacing: 0.5px;
    text-transform: uppercase; color: var(--text);
  }
  .status.is-ready { color: #eaffb0; }
  .status.is-error { color: var(--bad); }
  .status-sub { margin: 4px 0 20px; font-size: 13px; color: #d4e4e1; white-space: pre-line; }

  #play {
    display: inline-flex; align-items: center; gap: 12px;
    height: 44px; padding: 0 18px 0 24px; border-radius: 22px;
    border: 2px solid var(--olive-edge); background: var(--olive); color: var(--yellow);
    font: 700 16px/24px var(--font-ui); font-stretch: condensed; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  #play:hover:not(:disabled) { background: #4a4500; }
  #play:disabled { border-color: #444; background: #1a1a1a; color: #777; box-shadow: none; cursor: not-allowed; }
  #play:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }

  /* key hints: slate/teal rounded tabs with a grey key box, used by #play's kbd and the Controls rows */
  kbd {
    display: inline-flex; align-items: center; justify-content: center; min-width: 22px; padding: 2px 7px;
    border: 1px solid #5a6664; border-radius: 4px; background: #44504e; color: #f2f4f4;
    font: 700 12px/18px var(--font-ui); text-align: center;
  }
  #play kbd { background: rgba(0,0,0,0.35); border-color: var(--yellow); color: var(--yellow); }

  .problem { margin-top: 16px; text-align: left; background: rgba(0,0,0,0.4); border: 2px solid var(--bad-edge); border-radius: 6px; padding: 12px 16px; }
  .problem[hidden] { display: none; }
  .problem p { color: #ffd9d3; font-size: 13px; line-height: 20px; }

  .net { margin: 0; font-size: 13px; color: var(--muted); }

  .keys { display: grid; gap: 6px; margin: 0; }
  .keys > div {
    display: flex; align-items: center; gap: 16px; padding: 8px 12px;
    background: rgba(20, 45, 42, 0.5); border-radius: 14px;
  }
  .keys dt { order: 1; flex: none; margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .keys dd { color: var(--text); font-size: 13px; font-stretch: condensed; }
  .hint { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

  :focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  :focus:not(:focus-visible) { outline: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="landing">
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="chevron" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M4 10 L24 24 L4 38" fill="none" stroke="#3fa895" stroke-width="9" stroke-linecap="square"/>
          <path d="M20 10 L40 24 L20 38" fill="none" stroke="#9fd6cb" stroke-width="9" stroke-linecap="square"/>
        </svg>
        <h1 id="title">@TITLE@</h1>
      </div>
      <p class="fan">Fan project. Not affiliated with or endorsed by Electronic Arts.</p>
      <div class="bar" id="bar" hidden><div class="bar-fill" id="bar-fill"></div></div>
    </header>
    <div class="main">
      <section class="panel hero">
        <p class="status" id="line">Loading</p>
        <p class="status-sub" id="sub">Loading the game.</p>
        <button type="button" id="play" disabled>Play <kbd>Enter</kbd></button>
        <div class="problem" id="problem" hidden>
          <p id="problem-text"></p>
        </div>
      </section>
      <section class="panel">
        <h2>Controls</h2>
        <dl class="keys">
          <div><dt><kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&larr;</kbd> <kbd>&rarr;</kbd></dt><dd>Menus</dd></div>
          <div><dt><kbd>Enter</kbd></dt><dd>Select</dd></div>
          <div><dt><kbd>Esc</kbd></dt><dd>Back, pause</dd></div>
        </dl>
        <p class="hint">Change keys in the game's Options, Controls.</p>
      </section>
    </div>
    <section class="panel side">
      <h2>Online</h2>
      <p class="net" id="net"></p>
    </section>
  </div>
</div>
<script>
"use strict";
const canvas = document.getElementById("canvas");
const landing = document.getElementById("landing");
const lineEl = document.getElementById("line");
const subEl = document.getElementById("sub");
const playBtn = document.getElementById("play");
const barEl = document.getElementById("bar");
const barFillEl = document.getElementById("bar-fill");
const netEl = document.getElementById("net");
const problemEl = document.getElementById("problem");
const problemTextEl = document.getElementById("problem-text");
const autoplay = new URLSearchParams(location.search).has("play");

function showLanding() { landing.hidden = false; }
function hideLanding() { landing.hidden = true; }

// Loading/ready/error line, shown in the hero panel. An error always re-shows
// the landing instead of leaving a black canvas behind it.
function status(text, isError) {
  lineEl.textContent = isError ? "Could not start" : (text ? "Loading" : "Ready");
  lineEl.classList.toggle("is-error", !!isError);
  lineEl.classList.toggle("is-ready", !isError && !text);
  subEl.textContent = text;
  problemEl.hidden = !isError;
  problemTextEl.textContent = text;
  if (isError) { playBtn.disabled = true; showLanding(); }
}

const log = [];
window.recompLog = log; // for tests

async function gameId() {
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts.length && parts[parts.length - 1].includes(".")) parts.pop();
  return decodeURIComponent(parts[parts.length - 1] || "");
}

// The virtual network: one WebSocket to the server's /lan switch, the LAN part of
// nfsu2-web web/src/net/index.ts (MIT; Copyright (c) 2026 th0mk; portions (c) 2026
// Talha Müderrisoğlu). Resolves to { ws, vip } once welcomed, or null in 3 s.
function lanConnect() {
  const url = new URLSearchParams(location.search).get("lan") ||
    `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/lan`;
  return new Promise((resolve) => {
    let ws;
    try { ws = new WebSocket(url); } catch { return resolve(null); }
    ws.binaryType = "arraybuffer";
    const timer = setTimeout(() => { ws.close(); resolve(null); }, 3000);
    ws.onopen = () => ws.send(JSON.stringify({ t: "hello", name: "player", deltas: 1, lan: 0 }));
    ws.onerror = () => { clearTimeout(timer); resolve(null); };
    ws.onmessage = (e) => {
      if (typeof e.data !== "string") return;
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.t === "welcome" && typeof m.vip === "number") { clearTimeout(timer); resolve({ ws, vip: m.vip >>> 0 }); }
    };
  });
}

// C calls Module.lanAttach(mailbox) once (net_lan.cpp lan_mailbox). From then on
// frames go TX ring -> socket and socket -> RX ring. Words and slots: net_proto.h.
function lanBridge(Module, { ws, vip }) {
  const W = { TX_OFF: 6, RX_OFF: 7, TX_HEAD: 10, TX_BELL: 11, RX_TAIL: 12, PAGE_STATE: 16, VIP: 17,
              NETMASK: 18, GENERATION: 19, TX_TAIL: 20, RX_HEAD: 21, RX_BELL: 22 };
  const SLOT = 1536, TX_SLOTS = 128, RX_SLOTS = 256, S_DATA = 32, F_DATA = 16, MAX = 1472, ONLINE = 2, OFFLINE = 3;
  let base = 0;
  const i32 = () => new Int32Array(Module.HEAPU8.buffer); // fresh: memory growth replaces the buffer
  const word = (w) => (base >> 2) + w;
  const rx = (b) => {
    const len = b.byteLength - F_DATA;
    if (!base || len < 0 || len > MAX) return;
    const I = i32(), head = Atomics.load(I, word(W.RX_HEAD));
    if (head - Atomics.load(I, word(W.RX_TAIL)) >= RX_SLOTS) return; // C is behind: dropped, as nfsu2-web does
    const f = new DataView(b), v = new DataView(Module.HEAPU8.buffer);
    const s = base + I[word(W.RX_OFF)] + ((head >>> 0) % RX_SLOTS) * SLOT;
    v.setUint32(s, len, true);
    v.setUint32(s + 4, f.getUint8(0), true);
    v.setUint32(s + 8, f.getUint32(4), true);
    v.setUint32(s + 12, f.getUint32(8), true);
    v.setUint16(s + 16, f.getUint16(12), true);
    v.setUint16(s + 18, f.getUint16(14), true);
    Module.HEAPU8.set(new Uint8Array(b, F_DATA), s + S_DATA);
    Atomics.store(I, word(W.RX_HEAD), (head + 1) | 0);
    Atomics.add(I, word(W.RX_BELL), 1);
    Atomics.notify(I, word(W.RX_BELL));
  };
  const tx = async () => {
    for (;;) {
      const I = i32(), bell = Atomics.load(I, word(W.TX_BELL));
      let tail = Atomics.load(I, word(W.TX_TAIL));
      while (tail !== Atomics.load(I, word(W.TX_HEAD))) {
        const v = new DataView(Module.HEAPU8.buffer);
        const s = base + I[word(W.TX_OFF)] + ((tail >>> 0) % TX_SLOTS) * SLOT, len = v.getUint32(s, true);
        if (len <= MAX && ws.readyState === WebSocket.OPEN) {
          const f = new Uint8Array(F_DATA + len), fv = new DataView(f.buffer);
          f[0] = v.getUint32(s + 4, true);
          fv.setUint32(4, vip); // the switch writes the real one
          fv.setUint32(8, v.getUint32(s + 12, true));
          fv.setUint16(12, v.getUint16(s + 16, true));
          fv.setUint16(14, v.getUint16(s + 18, true));
          f.set(Module.HEAPU8.subarray(s + S_DATA, s + S_DATA + len), F_DATA); // a copy: a socket cannot send shared memory
          ws.send(f);
        }
        tail = (tail + 1) | 0;
        Atomics.store(I, word(W.TX_TAIL), tail);
      }
      if (ws.readyState > WebSocket.OPEN) return;
      const w = Atomics.waitAsync(I, word(W.TX_BELL), bell, 1000);
      if (w.async) await w.value;
    }
  };
  ws.onmessage = (e) => { if (typeof e.data !== "string") rx(e.data); };
  ws.onclose = () => { if (base) Atomics.store(i32(), word(W.PAGE_STATE), OFFLINE); console.warn("lan: the switch went away"); };
  Module.lanAttach = (ptr) => {
    base = ptr;
    const I = i32();
    Atomics.store(I, word(W.VIP), vip | 0);
    Atomics.store(I, word(W.NETMASK), 0xffff0000 | 0);
    Atomics.add(I, word(W.GENERATION), 1);
    Atomics.store(I, word(W.PAGE_STATE), ws.readyState === WebSocket.OPEN ? ONLINE : OFFLINE);
    tx();
  };
}

// The URL to return to on quit: this page, without ?play so the landing shows
// instead of starting the game straight back up.
function landingUrl() {
  const q = new URLSearchParams(location.search);
  q.delete("play");
  const s = q.toString();
  return location.pathname + (s ? `?${s}` : "");
}

function vipText(vip) { return `${vip >>> 24}.${(vip >> 16) & 255}.${(vip >> 8) & 255}.${vip & 255}`; }

async function start() {
  if (!crossOriginIsolated) throw new Error("This page must be served cross-origin isolated (COOP/COEP headers).");
  if (!navigator.gpu) throw new Error("This browser has no WebGPU.");
  const id = await gameId();
  const games = await fetch("../games.json").then((r) => r.json());
  const game = games.find((g) => g.id === id);
  if (!game) throw new Error(`No game "${id}" in the launcher's games.json.`);
  document.title = game.title;
  document.getElementById("title").textContent = game.title;

  // A streamed game (web_launcher.py --stream) is served beside this page in
  // data/; otherwise the launcher must have imported it first.
  const streamed = await fetch("data/manifest.txt", { method: "HEAD" }).then((r) => r.ok).catch(() => false);
  let dir = await navigator.storage.getDirectory();
  if (!streamed) try {
    for (const p of [id, "game"]) dir = await dir.getDirectoryHandle(p);
    await dir.getFileHandle(game.executable);
  } catch {
    throw new Error(`${game.title} has not been imported yet.`);
  }

  const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!adapter) throw new Error("WebGPU gave no adapter.");
  const wanted = ["texture-compression-bc", "depth32float-stencil8", "float32-filterable",
                  "unorm16-texture-formats", "rg11b10ufloat-renderable"];
  const requiredFeatures = wanted.filter((f) => adapter.features.has(f));
  const requiredLimits = {};
  for (const k of ["maxTextureDimension2D", "maxBufferSize", "maxStorageBufferBindingSize",
                   "maxUniformBufferBindingSize", "maxBindGroups", "maxSampledTexturesPerShaderStage",
                   "maxSamplersPerShaderStage", "maxStorageBuffersPerShaderStage",
                   "maxUniformBuffersPerShaderStage", "maxDynamicUniformBuffersPerPipelineLayout",
                   "maxVertexBuffers", "maxVertexAttributes", "maxColorAttachments",
                   "maxInterStageShaderVariables"])
    if (k in adapter.limits) requiredLimits[k] = adapter.limits[k];
  const device = await adapter.requestDevice({ requiredFeatures, requiredLimits });
  device.lost.then((info) => status(`The graphics device was lost: ${info.message}`, true));
  device.addEventListener("uncapturederror", (e) => console.error("WebGPU:", e.error.message));

  const lan = await lanConnect();
  netEl.textContent = lan
    ? `Online, on this server's network as ${vipText(lan.vip)}.`
    : "Offline: single player, not joined to any server.";
  console.log(lan ? `lan: on the virtual network as ${vipText(lan.vip)}` : "lan: offline");
  const exe = streamed ? `/data/${game.executable}` : `/opfs/${id}/game/${game.executable}`;
  const Module = {
    canvas,
    exe,
    preinitializedWebGPUDevice: device,
    noInitialRun: true,
    // Lets Module.onExit fire when the game calls exit() (kernel32.cpp
    // ExitProcess), even though the build links -sEXIT_RUNTIME=0: without
    // this, Emscripten's keepRuntimeAlive() stays true and the runtime never
    // reports the exit, so the page would be stuck on a dead canvas instead
    // of returning to the landing.
    noExitRuntime: false,
    onExit: () => location.replace(landingUrl()),
    print: (t) => { log.push(t); console.log(t); },
    printErr: (t) => {
      log.push(t); console.warn(t);
      // The native side's own exit log (loader.cpp, right after the guest
      // process's entry point returns): the one page-visible signal that the
      // game quit, since this build's -sEXIT_RUNTIME=0 keeps Emscripten's own
      // runtime "alive" forever, so Module.onExit never fires (the exact
      // reason: _proc_exit in the generated JS only calls onExit when
      // !keepRuntimeAlive(), and keepRuntimeAlive() is hardcoded true by that
      // build flag; Module.noExitRuntime cannot turn it back off, since the
      // generated code only honors a truthy override, never a falsy one). A
      // log-text match is a soft signal: if this message ever changes or is
      // filtered out, this stops firing and the page needs a real export
      // instead (an EM_JS call at the same spot in loader.cpp).
      if (/guest process exited with code/.test(t)) location.replace(landingUrl());
    },
    setStatus: (t) => {
      const m = /\((\d+)\/(\d+)\)/.exec(t || "");
      barEl.hidden = !m;
      if (m) barFillEl.style.width = `${(100 * m[1]) / m[2]}%`;
      status(t || "");
    },
    onAbort: (what) => status(`The game stopped: ${what}`, true),
    preRun: [() => {
      const m = Module;
      m.ENV.RECOMP_PROFILE_DIR = `/opfs/${id}/profile`;
      if (streamed) m.ENV.RECOMP_STREAM = new URL("data", location.href).pathname;
      const extra = new URLSearchParams(location.search);
      for (const [k, v] of extra) if (k.startsWith("RECOMP_")) m.ENV[k] = v;
      if (lan) {
        m.ENV.RECOMP_LAN = "1";
        m.ENV.RECOMP_SETTING_hide_online = "0";
        m.ENV.RECOMP_SETTING_fesl_plain = "1";
      }
    }],
    onRuntimeInitialized() {
      status("");
      playBtn.disabled = false;
      if (autoplay) play();
    },
  };
  window.Module = Module;
  if (lan) lanBridge(Module, lan);
  const script = document.createElement("script");
  script.src = "@APP@.js";
  script.onerror = () => status("The game's web build is missing.", true);
  document.body.append(script);
}

function play() {
  if (playBtn.disabled) return;
  hideLanding();
  canvas.focus();
  window.Module.callMain([`--exe=${window.Module.exe}`]);
}

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("click", () => canvas.focus());
playBtn.addEventListener("click", play);
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && !playBtn.disabled && !landing.hidden) play(); });
start().catch((e) => status(e.message, true));
</script>
</body>
</html>
